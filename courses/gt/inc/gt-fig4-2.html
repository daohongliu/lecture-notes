<figure class="wide" id="fig4-2">
  <div class="fig-body">
    <svg id="gt-fp-svg" class="pt" viewBox="0 0 720 330" role="img" aria-label="A continuous function on the unit interval with draggable points, and its fixed points where it crosses the diagonal."></svg>
    <div class="controls"><span class="btn-row"><button id="gt-fp-jump" aria-pressed="false">allow a jump</button><button id="gt-fp-rand" class="ghost">random f</button></span></div>
    <div class="readout" id="gt-fp-out" aria-live="polite"></div>
  </div>
  <figcaption><span class="figtag">Figure 4.2</span>Brouwer in one dimension (Proposition 4.13). Drag the points to draw \(f:[0,1]\to[0,1]\); its fixed points, where the graph meets the diagonal, are ringed. However you draw it, there is at least one. Allow a jump and you can make the graph leap over the diagonal: without continuity the theorem fails.</figcaption>
</figure>
