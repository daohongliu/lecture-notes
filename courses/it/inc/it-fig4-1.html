  <div class="fig-body">
    <svg id="it-ch-svg" class="pt" viewBox="0 0 720 300" role="img" aria-label="A binary channel drawn as arrows from inputs to outputs, and the mutual information as a function of the input distribution, with the capacity marked."></svg>
    <div class="controls">
      <span class="btn-row" role="group" aria-label="channel" id="it-ch-btns"></span>
