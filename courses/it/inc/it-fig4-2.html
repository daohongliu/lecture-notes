  <figcaption><span class="figtag">Figure 4.2</span>Rate against block error probability (log scale) on a binary symmetric channel. Repetition codes (dots) buy reliability by giving up rate, heading for the corner at rate \(0\). Hamming codes (squares) do better. Shannon’s theorem says every rate left of the dashed line \(C=1-H(q)\) can be paired with as small an error as you like: the whole shaded strip, down to the bottom of the plot and beyond, is reachable with long enough blocks.</figcaption>
